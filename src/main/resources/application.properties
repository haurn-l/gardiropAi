spring.application.name=backend
# Sunucu Portu
server.port=8080
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
gardirop.photos.directory=${GARDIROP_PHOTO_DIR:${user.home}/.gardiropai/photos}

# PostgreSQL Baglanti Ayarlari
spring.datasource.url=jdbc:postgresql://localhost:5432/gardirop_ai
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Ayarlari
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
