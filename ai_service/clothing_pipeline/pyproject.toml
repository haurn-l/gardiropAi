
# GardropAI — Clothing AI Pipeline
# Python package and dependency configuration

[project]
name = "gardirop-ai-clothing"
version = "0.1.0"
description = "GardropAI clothing segmentation, labeling and embedding service."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # HTTP API and request validation
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    # Image processing and numerical utilities
    "Pillow>=11.0,<13.0",
    "numpy>=1.26,<3.0",
    # Model manifest and configuration files
    "PyYAML>=6.0,<7.0",
    "opencv-python-headless>=4.10,<5.0",
    "einops>=0.8.2",
    "kornia>=0.9.2",
    # Inference dependencies are needed outside the development environment.
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers>=4.47,<5.0",
    "huggingface-hub>=0.27,<1.0",
    "safetensors>=0.5,<1.0",
    "timm>=1.0.17,<2.0",
    "open_clip_torch==3.3.0",
]

[dependency-groups]
dev = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1.0",
    "gradio>=6.0,<7.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gardirop_ai_clothing"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]


# CUDA-enabled PyTorch packages for RTX 4050

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
